name: Python style checks

on:
  workflow_call:
    inputs:
      app_repository:
        description: 'The GIT repository to test (defaults to `github.repository`)'
        required: false
        default: ${{ github.repository }}
        type: string
      app_branch_name:
        description: 'The GIT branch to test (defaults to `github.ref`)'
        required: false
        default: ${{ github.ref }}
        type: string
      run_type_check:
        description: "Whether to run mypy type check (defaults to false)"
        required: true
        type: boolean
      src_directory:
        description: "The directory containing the python sources to check"
        required: true
        type: string
      req_directory:
        description: "The directory containing the requirements.txt (if any)"
        required: false
        default: ''
        type: string
      setup_directory:
        description: "The directory containing the setup.cfg (if any)"
        required: false
        default: ''
        type: string
      additional_packages:
        description: "Additional packages to install (default to none)"
        required: false
        default: ''
        type: string
      python_version:
        description: "Python version to use (defaults to '3.12')"
        required: false
        default: '3.12'
        type: string

permissions:
  contents: read

env:
  APP_REPOSITORY: ${{ inputs.app_repository }}
  APP_BRANCH_NAME: ${{ inputs.app_branch_name }}
  RUN_TYPE_CHECK: ${{ inputs.run_type_check }}
  SRC_DIRECTORY: ${{ inputs.src_directory }}
  REQ_DIRECTORY: ${{ inputs.req_directory }}
  SETUP_DIRECTORY: ${{ inputs.setup_directory }}
  ADDITIONAL_PACKAGES: ${{ inputs.additional_packages }}
  PYTHON_VERSION: ${{ inputs.python_version }}

jobs:
  linter:
    name: Python Linting with 'ruff'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ledger-app-workflows
        uses: actions/checkout@v6
        with:
          repository: LedgerHQ/ledger-app-workflows
          path: ./ledger-app-workflows
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}

      - name: Installing required packages
        if: ${{ inputs.additional_packages != '' }}
        run: ./ledger-app-workflows/scripts/apt_install.sh ${ADDITIONAL_PACKAGES}

      - name: Clone
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ inputs.app_branch_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}
          cache: 'pip'

      - name: Installing Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

          # Install project requirements
          if [ -n "${REQ_DIRECTORY}" ] && [ -f "${REQ_DIRECTORY}/requirements.txt" ]; then
            pip install -r "${REQ_DIRECTORY}/requirements.txt"
          fi

      - name: Set working directory
        run: |
          if [ -n "${SETUP_DIRECTORY}" ]; then
            echo "WORK_DIR=${SETUP_DIRECTORY}" >> "${GITHUB_ENV}"
          else
            echo "WORK_DIR=." >> "${GITHUB_ENV}"
          fi

      - name: Run ruff formatting
        working-directory: ${{ env.WORK_DIR }}
        run: |
          ruff format --check "${SRC_DIRECTORY}"

      - name: Run ruff check
        working-directory: ${{ env.WORK_DIR }}
        run: |
          ruff check "${SRC_DIRECTORY}"

  mypy:
    name: Type checking
    if: ${{ inputs.run_type_check == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ledger-app-workflows
        uses: actions/checkout@v6
        with:
          repository: LedgerHQ/ledger-app-workflows
          path: ./ledger-app-workflows
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}

      - name: Installing required packages
        if: ${{ inputs.additional_packages != '' }}
        run: ./ledger-app-workflows/scripts/apt_install.sh ${ADDITIONAL_PACKAGES}

      - name: Clone
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ inputs.app_branch_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}
          cache: 'pip'

      - name: Installing Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          if [ -n "${REQ_DIRECTORY}" ] && [ -f "${REQ_DIRECTORY}/requirements.txt" ]; then
            pip install -r "${REQ_DIRECTORY}/requirements.txt"
          fi

      - name: Set working directory
        run: |
          if [ -n "${SETUP_DIRECTORY}" ]; then
            echo "WORK_DIR=${SETUP_DIRECTORY}" >> "${GITHUB_ENV}"
          else
            echo "WORK_DIR=." >> "${GITHUB_ENV}"
          fi

      - name: Mypy type checking
        working-directory: ${{ env.WORK_DIR }}
        run: |
          mypy "${SRC_DIRECTORY}"
