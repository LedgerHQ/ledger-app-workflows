name: Analyze the application with CodeQL

on:
  workflow_call:
    inputs:
      app_repository:
        description: 'The GIT repository to build (defaults to `github.repository`)'
        required: false
        default: ${{ github.repository }}
        type: string
      app_branch_name:
        description: 'The GIT branch to build (defaults to `github.ref`)'
        required: false
        default: ${{ github.ref }}
        type: string
      run_for_devices:
        description: |
          The list of device(s) on which the CI will run.

          Defaults to the full list of device(s) supported by the application as configured in the
          'ledger_app.toml' manifest.
          If the manifest is missing, defaults to ALL (["nanos", "nanox", "nanosp", "stax", "flex", "apex_m", "apex_p"]).
        required: false
        default: 'None'
        type: string
      builder:
        description: "The docker image to build the application in (defaults to ledger-app-builder-lite)"
        required: false
        default: 'ledger-app-builder-lite'
        type: string
      flags:
        description: "Additional flags (default to none)"
        required: false
        default: ''
        type: string
      sdk_reference:
        description: |
          A SDK reference to checkout before building the app.
          Default behavior is to build on the current version of the app-builder Docker image.
        required: false
        default: ""
        type: string
      use_cmake:
        description: |
          Build the application with its CMake presets instead of make (defaults to false).

          Each device is built with the preset of the same name in the application `CMakePresets.json`
          ('nanosp' uses the 'nanos2' preset). Flags are passed as CMake cache variables.
          The SDK must support CMake: use `sdk_reference` if the builder SDK does not.
        required: false
        default: false
        type: boolean
    secrets:
      token:
        description: 'A token used to checkout private repositories'
        required: false

permissions:
  contents: read
  security-events: write  # Needed for CodeQL analysis upload
  actions: read           # Needed by github/codeql-action to query the workflow run

env:
  APP_REPOSITORY: ${{ inputs.app_repository }}
  APP_BRANCH_NAME: ${{ inputs.app_branch_name }}
  RUN_FOR_DEVICES: ${{ inputs.run_for_devices }}
  BUILDER: ${{ inputs.builder }}
  FLAGS: ${{ inputs.flags }}
  SDK_REFERENCE: ${{ inputs.sdk_reference }}
  USE_CMAKE: ${{ inputs.use_cmake }}

jobs:
  call_get_app_metadata:
    # This job digests inputs and repository metadata provided by the `ledger_app.toml` manifest
    # file, in order to output relevant compatible devices needed by following jobs.
    name: Retrieve application metadata
    uses: ./.github/workflows/_get_app_metadata.yml
    with:
      app_repository: ${{ inputs.app_repository }}
      app_branch_name: ${{ inputs.app_branch_name }}
      compatible_devices: ${{ inputs.run_for_devices }}
    secrets:
      token: ${{ secrets.token }}

  build_device_matrix:
    name: Build device matrix
    needs: call_get_app_metadata
    runs-on: ubuntu-latest
    outputs:
      sdks_config: ${{ steps.sdk_list.outputs.sdks_config }}

    steps:
      - name: Define the list of devices to target
        id: sdk_list
        shell: bash
        run: |
          if [ "${RUN_FOR_DEVICES}" = "None" ]; then
            # Use the compatible devices from metadata
            devices_json='${{ needs.call_get_app_metadata.outputs.compatible_devices }}'
          else
            # Convert space-separated string to JSON array
            devices_string="${RUN_FOR_DEVICES}"
            devices_json=$(echo "${devices_string}" | jq -R 'split(" ")')
          fi

          # Generate SDK environment variables from device names
          sdks_json=$(echo "${devices_json}" | jq -c 'map("$" + (. | ascii_upcase) + "_SDK")')

          echo "sdks_config=${sdks_json}" >> "${GITHUB_OUTPUT}"

      - name: Print devices and SDKs
        run: |
          echo "SDKs: ${{ steps.sdk_list.outputs.sdks_config }}"

  analyse:
    name: Analyse application
    needs: build_device_matrix
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJSON(needs.build_device_matrix.outputs.sdks_config) }}
        # 'cpp' covers C and C++
        language: ['cpp']
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/${{ inputs.builder }}:latest

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ inputs.app_branch_name }}
          submodules: recursive
          token: ${{ secrets.token && secrets.token || github.token }}

      - name: Compute the device name
        env:
          SDK: ${{ matrix.sdk }}
        shell: bash
        run: |
          # Turn '$NANOS_SDK' into 'nanos', to be used in the artifact name
          device="${SDK#\$}"
          device="${device%_SDK}"
          echo "DEVICE=${device,,}" >> "${GITHUB_ENV}"

      - name: Checkout SDK
        if: ${{ inputs.sdk_reference != '' }}
        shell: bash
        run: |
          BOLOS_SDK=${{ matrix.sdk }}
          echo "Checking out reference '${SDK_REFERENCE}' in ${BOLOS_SDK}..."
          git -C "${BOLOS_SDK}" fetch -apt && git -C "${BOLOS_SDK}" checkout ${SDK_REFERENCE}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # CodeQL will create the database during the compilation
      - name: Build
        shell: bash
        run: |
          if [ "${USE_CMAKE}" = "true" ]; then
            if [ ! -f CMakePresets.json ]; then
              echo "::error::'use_cmake' is set but CMakePresets.json is missing"
              exit 1
            fi
            export BOLOS_SDK=${{ matrix.sdk }}
            PRESET="$(echo "${DEVICE}" | sed 's/nanosp/nanos2/')"
            # Make-style flags (e.g. DEBUG=1) become CMake cache variables
            CMAKE_ARGS=()
            for flag in ${FLAGS}; do
              CMAKE_ARGS+=("-D${flag}")
            done
            cmake --preset "${PRESET}" "${CMAKE_ARGS[@]}"
            cmake --build --preset "${PRESET}" -j
          else
            make BOLOS_SDK="${{ matrix.sdk }}" ${FLAGS}
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          # Uploading the results to the 'Code scanning' tab requires GitHub Advanced Security,
          # which is only available on public repositories (or with a GHAS license).
          # On private/internal repositories, run the analysis but skip the upload.
          upload: ${{ github.event.repository.visibility == 'public' && 'always' || 'never' }}
          output: ${{ runner.temp }}/codeql-results

      # The 'Code scanning' tab is unavailable without Advanced Security, so the SARIF results are
      # exposed as a build artifact instead.
      - name: Upload the SARIF results as an artifact
        if: ${{ github.event.repository.visibility != 'public' }}
        uses: actions/upload-artifact@v6
        with:
          name: codeql-sarif-${{ matrix.language }}-${{ env.DEVICE }}
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: error
