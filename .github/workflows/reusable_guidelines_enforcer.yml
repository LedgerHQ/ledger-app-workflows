name: Ensure app compliance with Ledger guidelines

on:
  workflow_call:
    inputs:
      app_repository:
        description: 'The GIT repository to build (defaults to `github.repository`)'
        required: false
        default: ${{ github.repository }}
        type: string
      run_for_devices:
        description: |
          The list of device(s) on which the test will run.

          Defaults to the full list of device(s) supported by the application as configured in the
          'ledger_app.toml' manifest.
          If the manifest is missing, defaults to ALL (["nanos", "nanox", "nanosp", "stax", "flex", "apex_m", "apex_p"]).
        required: false
        default: 'None'
        type: string
    secrets:
      git_token:
        description: 'A token used as authentication for GIT operations. Useful when including this workflow in a private repository.'
        required: false

permissions:
  contents: read
  actions: write        # Needed for _get_app_manifest.yml and _check_*.yml workflows
  pull-requests: write  # Required by reusable_build.yml (for diff_elf_sizes job, unused here)

env:
  APP_REPOSITORY: ${{ inputs.app_repository }}
  RUN_FOR_DEVICES: ${{ inputs.run_for_devices }}

jobs:
  call_get_app_metadata:
    # This job digests inputs and repository metadata provided by the `ledger_app.toml` manifest
    # file, in order to output relevant directories, compatible devices, and other variables needed
    # by following jobs.
    name: Retrieve application metadata
    uses: ./.github/workflows/_get_app_metadata.yml
    with:
      app_repository: ${{ inputs.app_repository }}
      compatible_devices: ${{ inputs.run_for_devices }}

  call_build:
    # Build the application once, the canonical way, so that the manifest job can
    # reduce the listed glyphs to the ones actually embedded in the binary (the SDK
    # garbage-collects unreferenced glyphs at link time).
    name: Build application
    needs: call_get_app_metadata
    uses: ./.github/workflows/reusable_build.yml
    with:
      app_repository: ${{ inputs.app_repository }}
      run_for_devices: ${{ needs.call_get_app_metadata.outputs.compatible_devices }}
      upload_app_binaries_artifact: guidelines_enforcer_app_binaries
      builder: ledger-app-builder
    secrets:
      token: ${{ secrets.git_token }}

  call_get_app_manifest:
    name: Dump app information
    needs: [call_get_app_metadata, call_build]
    # Run regardless of call_build's result: it is skipped for Rust apps (no glyph
    # filtering) and the explicit success checks below keep this job independent of it.
    # For C apps the build is required: if it failed there is no binary, and the manifest
    # dump will then fail with an explicit "build the application first" error.
    if: ${{ always() && !cancelled() && needs.call_get_app_metadata.result == 'success' }}
    uses: ./.github/workflows/_get_app_manifest.yml
    with:
      app_repository: ${{ inputs.app_repository }}
      run_for_devices: ${{ needs.call_get_app_metadata.outputs.compatible_devices }}
      relative_app_directory: ${{ needs.call_get_app_metadata.outputs.build_directory }}
      is_rust: ${{ needs.call_get_app_metadata.outputs.is_rust }}
      upload_manifest_artifact_name: manifests
      download_app_binaries_artifact_name: guidelines_enforcer_app_binaries

  call_check_icons:
    name: Dispatch check
    needs: [call_get_app_metadata, call_get_app_manifest]
    if: ${{ always() && !cancelled() && needs.call_get_app_metadata.result == 'success' && needs.call_get_app_manifest.result == 'success' }}
    uses: ./.github/workflows/_check_icons.yml
    with:
      app_repository: ${{ inputs.app_repository }}
      download_manifest_artifact_name: manifests
      run_for_devices: ${{ needs.call_get_app_metadata.outputs.compatible_devices }}

  call_check_app_load_params:
    name: Dispatch check
    needs: call_get_app_manifest
    if: ${{ always() && !cancelled() && needs.call_get_app_manifest.result == 'success' }}
    uses: ./.github/workflows/_check_app_load_params.yml
    with:
      download_manifest_artifact_name: manifests

  call_check_makefile:
    name: Dispatch check
    needs: [call_get_app_metadata, call_get_app_manifest]
    if: ${{ always() && !cancelled() && needs.call_get_app_metadata.result == 'success' && needs.call_get_app_manifest.result == 'success' }}
    uses: ./.github/workflows/_check_makefile.yml
    with:
      app_repository: ${{ inputs.app_repository }}
      download_manifest_artifact_name: manifests
      run_for_devices: ${{ needs.call_get_app_metadata.outputs.compatible_devices }}

  call_check_readme:
    name: Dispatch check
    uses: ./.github/workflows/_check_readme.yml
    with:
      app_repository: ${{ inputs.app_repository }}

  call_check_changelog:
    name: Dispatch check
    needs: call_get_app_metadata
    # Only relevant on pull requests, and skipped when the 'no_changelog' label is set
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no_changelog')
    uses: ./.github/workflows/_check_changelog.yml
    with:
      app_repository: ${{ inputs.app_repository }}
      is_rust: ${{ needs.call_get_app_metadata.outputs.is_rust }}

  call_clang_static_analyzer:
    name: Dispatch check
    needs: call_get_app_metadata
    uses: ./.github/workflows/_check_clang_static_analyzer.yml
    with:
      app_repository: ${{ inputs.app_repository }}
      run_for_devices: ${{ needs.call_get_app_metadata.outputs.compatible_devices }}
      relative_app_directory: ${{ needs.call_get_app_metadata.outputs.build_directory }}
      is_rust: ${{ needs.call_get_app_metadata.outputs.is_rust }}

  call_clang_static_analyzer_latest_sdk:
    name: Dispatch check
    needs: call_get_app_metadata
    uses: ./.github/workflows/_check_clang_static_analyzer_latest_sdk.yml
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'scan_on_latest_sdk')
    with:
      app_repository: ${{ inputs.app_repository }}
      run_for_devices: ${{ needs.call_get_app_metadata.outputs.compatible_devices }}
      relative_app_directory: ${{ needs.call_get_app_metadata.outputs.build_directory }}
      is_rust: ${{ needs.call_get_app_metadata.outputs.is_rust }}
